<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MINI 12306 · 车票预订</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
        body{background:linear-gradient(120deg,#f0f7ff,#f8fcff);height:100vh;display:flex;align-items:center;justify-content:center;}
        .card{width:380px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-radius:24px;padding:40px 30px;box-shadow:0 8px 30px rgba(42,127,170,0.1);}
        .title{font-size:22px;background:linear-gradient(90deg,#2A7FAA,#1B5A7A);-webkit-background-clip:text;color:transparent;font-weight:bold;margin-bottom:20px;text-align:center;}
        input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid #dbe4f0;margin:10px 0;outline:none;transition:0.3s;}
        input:focus{border-color:#2A7FAA;box-shadow:0 0 0 3px rgba(42,127,170,0.15);}
        button{width:100%;padding:15px;border-radius:18px;background:linear-gradient(90deg,#2A7FAA,#1B5A7A);color:white;border:none;margin:8px 0;font-size:15px;cursor:pointer;transition:0.2s;}
        button:active{transform:scale(0.98);}
        #tip{margin:12px 0;text-align:center;font-size:15px;color:#2A7FAA;}
    </style>
</head>
<body>
    <div class="card">
        <div class="title">车票预订</div>
        <p style="text-align:center;margin-bottom:10px">车次：<span id="tno"></span></p>
        <input id="seat" placeholder="请输入座位号（如 12F）">
        <button onclick="checkSeat()">校验座位</button>
        <div id="tip"></div>
        <button onclick="submitBuy()">确认购票</button>
    </div>

    <script>
        const url = new URL(location.href);
        const trainNo = url.searchParams.get("train") || "G100";
        document.getElementById("tno").innerText = trainNo;
        const username = localStorage.getItem("loginUser");

        function checkSeat(){
            let s = document.getElementById("seat").value.trim().toUpperCase();
            let num = "", char = "";
            for(let c of s){ if(!isNaN(c)) num+=c; else char+=c; }
            let row = parseInt(num);
            let t = document.getElementById("tip");
            if(!num||!char||row<1||row>17||!"ABCDF".includes(char)){ t.innerText="输入错误"; t.style.color="red"; return; }
            if("AF".includes(char)) t.innerText="座位类型：窗口";
            else if("CD".includes(char)) t.innerText="座位类型：过道";
            else if(char==="B") t.innerText="座位类型：中间";
            t.style.color="#2A7FAA";
        }

        function submitBuy(){
            checkSeat();
            if(document.getElementById("tip").innerText.includes("错误")){ alert("座位不合法"); return; }
            let seat = document.getElementById("seat").value;
            let form = new FormData();
            form.append("username", username);
            form.append("train_no", trainNo);
            form.append("seat", seat);
            fetch("/buy",{method:"POST",body:form})
            .then(res=>res.text())
            .then(msg=>{ alert(msg); if(msg==="购票成功") location.href="/order_page"; })
        }
    </script>
</body>
</html>
