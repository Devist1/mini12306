<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MINI 12306 - 用户注册</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }

        body {
            background-color: #f0f7ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-wrapper {
            display: flex;
            background: #ffffff;
            width: 100%;
            max-width: 1000px;
            border-radius: 28px;
            box-shadow: 0 16px 48px rgba(30, 90, 130, 0.12),
                        0 6px 16px rgba(30, 90, 130, 0.06);
            overflow: hidden;
        }

        .info-side {
            width: 45%;
            background: linear-gradient(135deg, #2A7FAA 0%, #1B5A7A 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-side .welcome-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .info-side .welcome-sub {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .info-side .tips-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-side .tips-list {
            list-style: none;
            line-height: 1.7;
            font-size: 14px;
            opacity: 0.9;
        }

        .info-side .tips-list li {
            margin-bottom: 10px;
            padding-left: 18px;
            position: relative;
        }

        .info-side .tips-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #fff;
            font-weight: bold;
        }

        .form-side {
            width: 55%;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-side .logo-title {
            font-size: 32px;
            color: #2A7FAA;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .form-side .logo-desc {
            font-size: 15px;
            color: #748c9c;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            height: 54px;
            padding: 0 20px;
            border: 1px solid #dde7f3;
            border-radius: 16px;
            background-color: #f7faff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2A7FAA;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(42, 127, 170, 0.1);
        }

        .register-btn {
            width: 100%;
            height: 54px;
            border-radius: 16px;
            background: linear-gradient(90deg, #2A7FAA, #1B5A7A);
            color: #fff;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 28px;
            transition: transform 0.2s ease;
        }

        .register-btn:active {
            transform: scale(0.97);
        }

        .login-tip {
            font-size: 14px;
            color: #748c9c;
            text-align: center;
        }

        .login-tip a {
            color: #2A7FAA;
            text-decoration: none;
            font-weight: 500;
            margin-left: 6px;
        }

        @media (max-width: 768px) {
            .register-wrapper {
                flex-direction: column;
            }
            .info-side, .form-side {
                width: 100%;
                padding: 40px 30px;
            }
            .info-side {
                order: 2;
            }
            .form-side {
                order: 1;
            }
        }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <!-- 左侧信息栏 -->
        <div class="info-side">
            <h2 class="welcome-title">加入 MINI 12306</h2>
            <p class="welcome-sub">
                注册成为平台用户，即可享受便捷的车票预订、订单管理等服务，开启您的智能出行之旅。
            </p>
            <div class="tips-title">
                <span>⚠️</span> 注册须知
            </div>
            <ul class="tips-list">
                <li>请填写真实有效的手机号，后续可用于账号找回与验证。</li>
                <li>密码长度建议不少于6位，包含字母、数字或特殊字符，提升账号安全性。</li>
                <li>请妥善保管您的账号信息，切勿向他人透露。</li>
                <li>学生用户注册后，可凭有效证件在购票时享受学生票折扣。</li>
            </ul>
        </div>

        <!-- 右侧注册表单 -->
        <div class="form-side">
            <h1 class="logo-title">用户注册</h1>
            <p class="logo-desc">创建账号，开启便捷出行</p>

            <form id="registerForm">
                <div class="input-group">
                    <input type="text" name="username" placeholder="请设置用户名" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="请设置密码" required>
                </div>
                <div class="input-group">
                    <input type="text" name="phone" placeholder="请输入手机号" required>
                </div>

                <button type="submit" class="register-btn">立即注册</button>
            </form>

            <div class="login-tip">
                已有账号？<a href="/">立即登录</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(e){
            e.preventDefault();
            const formData = new FormData(this);
            const res = await fetch("/do_register", {
                method:"POST",
                body:formData
            });
            const text = await res.text();
            if(text === "注册成功"){
                alert("注册成功，请登录！");
                location.href = "/";
            }else{
                alert(text);
            }
        })
    </script>
</body>
</html>
