<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MINI 12306 - 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e6f4ff 0%, #f0f7ff 50%, #f8fcff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            width: 460px;
            padding: 52px 44px;
            border-radius: 28px;
            box-shadow: 0 16px 48px rgba(30, 90, 130, 0.12),
                        0 6px 16px rgba(30, 90, 130, 0.06);
            text-align: center;
        }

        .login-title {
            font-size: 34px;
            color: #2374a3;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-desc {
            font-size: 15px;
            color: #748c9c;
            margin-bottom: 44px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            height: 54px;
            padding: 0 20px;
            border: 1px solid #dde7f3;
            border-radius: 16px;
            background-color: #f7faff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2374a3;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(35, 116, 163, 0.1);
        }

        .login-btn {
            width: 100%;
            height: 54px;
            border-radius: 16px;
            background: linear-gradient(90deg, #2374a3, #195c7c);
            color: #fff;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 28px;
            transition: transform 0.2s ease;
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .register-tip {
            font-size: 14px;
            color: #748c9c;
        }

        .register-tip a {
            color: #2374a3;
            text-decoration: none;
            font-weight: 500;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">MINI 12306</h1>
        <p class="login-desc">智能出行 · 便捷购票 · 安全可靠</p>

        <!-- 加了form表单，才能提交登录 -->
        <form id="loginForm">
            <div class="input-group">
                <input type="text" name="username" placeholder="请输入账号" value="admin">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="请输入密码" value="123">
            </div>

            <button type="submit" class="login-btn">立即登录</button>
        </form>

        <div class="register-tip">
            还没有账号？<a href="#" onclick="location.href='/register'">快速注册</a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e){
            e.preventDefault();
            const formData = new FormData(this);
            const res = await fetch("/check_login", {
                method:"POST",
                body:formData
            });
            const text = await res.text();
            if(text.startsWith("success")){
                location.href = "/index";
            }else{
                alert("账号或密码错误");
            }
        })
    </script>
</body>
</html>
