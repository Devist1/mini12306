<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>重置密码 - MINI 12306</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", system-ui, sans-serif; }
        body { background-color: #f0f7ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        .title { font-size: 24px; color: #2A7FAA; font-weight: 700; text-align: center; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #748c9c; text-align: center; margin-bottom: 30px; }
        .input-group { margin-bottom: 18px; }
        .input-group input { width: 100%; height: 50px; padding: 0 20px; border: 1px solid #dde7f3; border-radius: 14px; background-color: #f7faff; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #2A7FAA; background-color: #fff; box-shadow: 0 0 0 4px rgba(42,127,170,0.1); }
        .hint { font-size: 12px; color: #999; margin-top: -10px; margin-bottom: 10px; padding-left: 4px; }
        .btn { width: 100%; height: 54px; border-radius: 16px; background: linear-gradient(90deg, #2A7FAA, #1B5A7A); color: #fff; border: none; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
        .btn:active { transform: scale(0.97); }
        .link { text-align: center; font-size: 14px; }
        .link a { color: #2A7FAA; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="box">
        <div class="title">🔑 重置密码</div>
        <div class="subtitle">通过用户名、手机号、身份证号验证身份</div>
        <form id="resetForm">
            <div class="input-group"><input type="text" name="username" placeholder="请输入用户名" required></div>
            <div class="input-group"><input type="text" name="phone" placeholder="请输入注册手机号" required maxlength="11"></div>
            <div class="input-group"><input type="text" name="idcard" placeholder="请输入18位身份证号" required maxlength="18"></div>
            <div class="input-group"><input type="password" name="new_password" placeholder="请输入新密码（含大小写+数字，≥8位）" required id="newPwd"></div>
            <div class="hint">密码须包含大写字母、小写字母和数字，长度≥8位</div>
            <button type="submit" class="btn">重置密码</button>
        </form>
        <div class="link"><a href="/">← 返回登录</a></div>
    </div>
    <script>
        document.getElementById("resetForm").addEventListener("submit", async function(e){
            e.preventDefault();
            const formData = new FormData(this);
            const newPwd = formData.get("new_password").trim();
            if(newPwd.length < 8) { alert("密码长度不能少于8位"); return; }
            if(!/[A-Z]/.test(newPwd)) { alert("密码必须包含大写字母"); return; }
            if(!/[a-z]/.test(newPwd)) { alert("密码必须包含小写字母"); return; }
            if(!/\d/.test(newPwd)) { alert("密码必须包含数字"); return; }
            const res = await fetch("/do_reset_password", { method:"POST", body:formData });
            const text = await res.text();
            alert(text);
            if(text.includes("成功")) location.href = "/";
        })
    </script>
</body>
</html>
